<!-- PAGE PREVIEW CAROUSEL COMPONENT -->

<style>
  /* Modal Overlay */
  .carousel-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    z-index: 1000;
    overflow: hidden;
  }

  .carousel-modal.active {
    display: flex;
    flex-direction: column;
  }

  /* Modal Header */
  .carousel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: #111;
    border-bottom: 1px solid #333;
  }

  .carousel-title {
    color: #fff;
    font-size: 18px;
    margin: 0;
  }

  .carousel-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    padding: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .carousel-close:hover {
    color: #aaa;
  }

  /* Carousel Container */
  .carousel-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .carousel-slide {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .carousel-slide.active {
    display: block;
  }

  /* Navigation Buttons */
  .carousel-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    font-size: 36px;
    cursor: pointer;
    padding: 10px 15px;
    z-index: 10;
    transition: background 0.3s;
  }

  .carousel-button:hover {
    background: rgba(255, 255, 255, 0.4);
  }

  .carousel-prev {
    left: 10px;
  }

  .carousel-next {
    right: 10px;
  }

  /* Footer with Indicators */
  .carousel-footer {
    padding: 15px 20px;
    background: #111;
    border-top: 1px solid #333;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  .carousel-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    cursor: pointer;
    border: none;
    transition: background 0.3s;
  }

  .carousel-indicator.active {
    background: #fff;
  }

  .carousel-counter {
    color: #fff;
    font-size: 14px;
    margin-left: 15px;
  }

  /* Trigger Button */
  .preview-button {
    background: #666;
    color: #fff;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    margin-top: 15px;
    transition: background 0.3s;
  }

  .preview-button:hover {
    background: #555;
  }

  /* Mobile Responsiveness */
  @media (max-width: 768px) {
    .carousel-button {
      font-size: 24px;
      padding: 8px 12px;
    }

    .carousel-title {
      font-size: 16px;
    }
  }
</style>

<!-- TRIGGER BUTTON (place after the 3D book cover image) -->
<div style="text-align: center; margin: 20px 0;">
  <button class="preview-button" onclick="openCarousel()">
    Preview Pages Inside
  </button>
</div>

<!-- CAROUSEL MODAL -->
<div id="carouselModal" class="carousel-modal">
  <div class="carousel-header">
    <h2 class="carousel-title">Preview — The End of Time</h2>
    <button class="carousel-close" onclick="closeCarousel()">✕</button>
  </div>

  <div class="carousel-container">
    <img src="frontcover.jpeg" alt="Front Cover" class="carousel-slide active">
    <img src="toc.jpeg" alt="Table of Contents" class="carousel-slide">
    <img src="intro1.jpeg" alt="Introduction (Page 1)" class="carousel-slide">
    <img src="intro2.jpeg" alt="Introduction (Page 2)" class="carousel-slide">
    <img src="backcover.jpeg" alt="Back Cover" class="carousel-slide">

    <button class="carousel-button carousel-prev" onclick="prevSlide()">‹</button>
    <button class="carousel-button carousel-next" onclick="nextSlide()">›</button>
  </div>

  <div class="carousel-footer">
    <button class="carousel-indicator active" onclick="goToSlide(0)"></button>
    <button class="carousel-indicator" onclick="goToSlide(1)"></button>
    <button class="carousel-indicator" onclick="goToSlide(2)"></button>
    <button class="carousel-indicator" onclick="goToSlide(3)"></button>
    <button class="carousel-indicator" onclick="goToSlide(4)"></button>
    <span class="carousel-counter"><span id="currentSlide">1</span> / 5</span>
  </div>
</div>

<!-- JAVASCRIPT -->
<script>
  let currentSlide = 0;
  const slides = [
    { name: 'Front Cover' },
    { name: 'Table of Contents' },
    { name: 'Introduction (Page 1)' },
    { name: 'Introduction (Page 2)' },
    { name: 'Back Cover' }
  ];

  function openCarousel() {
    document.getElementById('carouselModal').classList.add('active');
    document.body.style.overflow = 'hidden'; // Prevent scrolling
  }

  function closeCarousel() {
    document.getElementById('carouselModal').classList.remove('active');
    document.body.style.overflow = 'auto'; // Restore scrolling
  }

  function showSlide(index) {
    const modal = document.getElementById('carouselModal');
    const slideElements = modal.querySelectorAll('.carousel-slide');
    const indicators = modal.querySelectorAll('.carousel-indicator');

    // Loop around
    if (index >= slideElements.length) {
      currentSlide = 0;
    } else if (index < 0) {
      currentSlide = slideElements.length - 1;
    } else {
      currentSlide = index;
    }

    // Update slides
    slideElements.forEach(slide => slide.classList.remove('active'));
    slideElements[currentSlide].classList.add('active');

    // Update indicators
    indicators.forEach(indicator => indicator.classList.remove('active'));
    indicators[currentSlide].classList.add('active');

    // Update counter
    document.getElementById('currentSlide').textContent = currentSlide + 1;
  }

  function nextSlide() {
    showSlide(currentSlide + 1);
  }

  function prevSlide() {
    showSlide(currentSlide - 1);
  }

  function goToSlide(index) {
    showSlide(index);
  }

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    const modal = document.getElementById('carouselModal');
    if (modal.classList.contains('active')) {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'Escape') closeCarousel();
    }
  });

  // Close modal when clicking outside the image
  document.getElementById('carouselModal').addEventListener('click', (e) => {
    if (e.target.id === 'carouselModal') {
      closeCarousel();
    }
  });
</script>
